name: Separate Releases (Windows & Linux/macOS)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ========================================================
  # JOB 1: BUILD, TEST & PHÁT HÀNH BẢN WINDOWS RIÊNG BIỆT
  # ========================================================
  release-windows:
    name: Build & Release Windows
    runs-on: windows-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Cài đặt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install fastapi uvicorn websockets httpx os-ken pywebview pyinstaller

      - name: Chạy kiểm thử pytest (Windows)
        run: |
          pytest -v

      - name: Dọn dẹp thư mục dev
        shell: bash
        run: |
          rm -rf tests docs .pytest_cache pcap stats.jsonl .env build.ps1 build.sh

      - name: Đóng gói PyInstaller (.exe)
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path "desktop\app.ico") {
            $iconArgs = @("--icon", "desktop\app.ico", "--add-data", "desktop\app.ico;desktop")
          }
          python -m PyInstaller `
            --noconfirm --clean --onefile --noconsole `
            --name "SDN-Emulator-windows-x64" `
            @iconArgs `
            --paths "src" `
            --add-data "src/sdnsim/ui;sdnsim/ui" `
            --add-data "topologies;topologies" `
            --add-data "examples/os_ken_controller.py;examples" `
            --exclude-module "tkinter" `
            --exclude-module "unittest" `
            --hidden-import "clr" `
            --hidden-import "pythonnet" `
            --collect-submodules "sdnsim" `
            --collect-submodules "uvicorn" `
            --collect-submodules "websockets" `
            --collect-all "webview" `
            --collect-all "pythonnet" `
            --collect-all "clr_loader" `
            --collect-all "os_ken" `
            --collect-all "oslo_config" `
            --collect-all "pbr" `
            --copy-metadata "os-ken" `
            --copy-metadata "pbr" `
            --copy-metadata "fastapi" `
            --copy-metadata "uvicorn" `
            desktop/main.py

      - name: Smoke test file .exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\SDN-Emulator-windows-x64.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            throw "File .exe bi crash khi khoi dong (ExitCode: $($proc.ExitCode))"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      # Đẩy riêng bản Windows lên Release với tag: <tag>-windows
      - name: Phát hành Release riêng cho Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-windows
          name: SDN Emulator ${{ github.ref_name }} (Windows)
          body: |
            ## SDN Emulator — Bản phát hành dành riêng cho Windows
            - Chạy trực tiếp trên Windows 10/11 x64 (không cần cài thêm Python hay môi trường).
            - File thực thi nguyên bản: `SDN-Emulator-windows-x64.exe`.
          files: dist/SDN-Emulator-windows-x64.exe

  # ========================================================
  # JOB 2: BUILD & TEST LINUX
  # ========================================================
  build-linux:
    name: Build & Test Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cài đặt dependencies hệ thống Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 libgirepository1.0-dev

      - name: Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install fastapi uvicorn websockets httpx os-ken pywebview pyinstaller

      - name: Chạy kiểm thử pytest (Linux)
        run: |
          pytest -v

      - name: Dọn dẹp thư mục dev
        run: |
          rm -rf tests docs .pytest_cache pcap stats.jsonl .env build.ps1 build.sh

      - name: Đóng gói PyInstaller (Linux)
        run: |
          python -m PyInstaller \
            --noconfirm --clean --onefile --noconsole \
            --name "SDN-Emulator-linux-x64" \
            --paths "src" \
            --add-data "src/sdnsim/ui:sdnsim/ui" \
            --add-data "topologies:topologies" \
            --add-data "examples/os_ken_controller.py:examples" \
            --exclude-module "tkinter" \
            --exclude-module "unittest" \
            --collect-submodules "sdnsim" \
            --collect-submodules "uvicorn" \
            --collect-submodules "websockets" \
            --collect-all "webview" \
            --collect-all "os_ken" \
            --collect-all "oslo_config" \
            --collect-all "pbr" \
            --copy-metadata "os-ken" \
            --copy-metadata "pbr" \
            --copy-metadata "fastapi" \
            --copy-metadata "uvicorn" \
            desktop/main.py
          chmod +x dist/SDN-Emulator-linux-x64

      - name: Lưu file nhị phân Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: dist/SDN-Emulator-linux-x64

  # ========================================================
  # JOB 3: BUILD & TEST MACOS
  # ========================================================
  build-macos:
    name: Build & Test macOS
    runs-on: macos-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install fastapi uvicorn websockets httpx os-ken pywebview pyinstaller

      - name: Chạy kiểm thử pytest (macOS)
        run: |
          pytest -v

      - name: Dọn dẹp thư mục dev
        run: |
          rm -rf tests docs .pytest_cache pcap stats.jsonl .env build.ps1 build.sh

      - name: Đóng gói PyInstaller (macOS)
        run: |
          python -m PyInstaller \
            --noconfirm --clean --onefile --noconsole \
            --name "SDN-Emulator-macos-arm64" \
            --paths "src" \
            --add-data "src/sdnsim/ui:sdnsim/ui" \
            --add-data "topologies:topologies" \
            --add-data "examples/os_ken_controller.py:examples" \
            --exclude-module "tkinter" \
            --exclude-module "unittest" \
            --collect-submodules "sdnsim" \
            --collect-submodules "uvicorn" \
            --collect-submodules "websockets" \
            --collect-all "webview" \
            --collect-all "os_ken" \
            --collect-all "oslo_config" \
            --collect-all "pbr" \
            --copy-metadata "os-ken" \
            --copy-metadata "pbr" \
            --copy-metadata "fastapi" \
            --copy-metadata "uvicorn" \
            desktop/main.py
          chmod +x dist/SDN-Emulator-macos-arm64

      - name: Lưu file nhị phân macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: dist/SDN-Emulator-macos-arm64

  # ========================================================
  # JOB 4: GOM FILE & PHÁT HÀNH BẢN LINUX/MACOS RIÊNG BIỆT
  # ========================================================
  release-linux-macos:
    name: Release Linux & macOS
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Tải về file nhị phân Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact
          path: dist-unix

      - name: Tải về file nhị phân macOS
        uses: actions/download-artifact@v4
        with:
          name: macos-artifact
          path: dist-unix

      - name: Cấp quyền thực thi
        run: |
          chmod +x dist-unix/SDN-Emulator-linux-x64
          chmod +x dist-unix/SDN-Emulator-macos-arm64
          ls -lh dist-unix/

      # Đẩy riêng bản Linux/macOS lên Release với tag: <tag>-linux-macos
      - name: Phát hành Release riêng cho Linux & macOS
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-linux-macos
          name: SDN Emulator ${{ github.ref_name }} (Linux & macOS)
          body: |
            ## SDN Emulator — Bản phát hành dành cho Linux & macOS
            - **Linux (x64):** `SDN-Emulator-linux-x64` (chạy lệnh `chmod +x SDN-Emulator-linux-x64 && ./SDN-Emulator-linux-x64`).
            - **macOS (Apple Silicon M1/M2/M3/M4):** `SDN-Emulator-macos-arm64`.
          files: |
            dist-unix/SDN-Emulator-linux-x64
            dist-unix/SDN-Emulator-macos-arm64