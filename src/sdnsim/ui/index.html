<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>SDN Emulator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 16px;
        }

        table {
            border-collapse: collapse;
            margin: 6px 0 14px;
        }

        th,
        td {
            border: 1px solid #bbb;
            padding: 3px 10px;
            text-align: right;
        }

        th {
            background: #eee;
        }

        .bar span {
            margin-right: 20px;
        }

        h3 {
            margin: 14px 0 2px;
        }
    </style>
</head>

<body>
    <h2>SDN Emulator</h2>
    <div class="bar">
        <span>Kết nối: <b id="status">...</b></span>
        <span>Giờ ảo: <b id="time">-</b></span>
        <span>PACKET_IN: <b id="pin">-</b></span>
    </div>
    <p>
        Ping từ <select id="src"></select> tới <select id="dst"></select>
        <button id="go">Ping</button>
    </p>
    <div id="topo"></div>
    <div id="hosts"></div>
    <div id="switches"></div>

    <script>
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const row = cells => "<tr>" + cells.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>";
        const head = cols => "<tr>" + cols.map(c => `<th>${esc(c)}</th>`).join("") + "</tr>";

        function fillSelects(hosts) {
            if ($("src").options.length) return;           // chỉ điền một lần
            for (const name of Object.keys(hosts)) {
                $("src").add(new Option(name, name));
                $("dst").add(new Option(name, name));
            }
            if ($("dst").options.length > 1) $("dst").selectedIndex = 1;
        }
        let prev = {};

        function layout(s) {
            const pos = {};
            Object.keys(s.switches).forEach((n, i) => pos[n] = { x: 110 + i * 230, y: 90, sw: true });
            const attach = {};
            for (const l of s.links)
                for (const [h, o] of [[l.a, l.b], [l.b, l.a]])
                    if (s.hosts[h] && s.switches[o]) (attach[o] ||= []).push(h);
            for (const [sw, hs] of Object.entries(attach))
                hs.forEach((h, j) => pos[h] = { x: pos[sw].x + (j - (hs.length - 1) / 2) * 110, y: 210, sw: false });
            return pos;
        }

        function linkPackets(s, l) {
            for (const [n, p] of [[l.a, l.a_port], [l.b, l.b_port]]) {
                const c = s.switches[n] && s.switches[n].ports[p];
                if (c) return c.rx_packets + c.tx_packets;
            }
            return 0;
        }

        function drawTopo(s) {
            const pos = layout(s);
            const W = Math.max(480, 110 + Object.keys(s.switches).length * 230), H = 270;
            let g = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
            for (const l of s.links) {
                const a = pos[l.a], b = pos[l.b];
                if (!a || !b) continue;
                const key = `${l.a}:${l.a_port}-${l.b}:${l.b_port}`;
                const pk = linkPackets(s, l);
                const active = pk > (prev[key] ?? pk);     // có gói mới kể từ lần đẩy trước
                prev[key] = pk;
                const w = 2 + Math.min(6, Math.log2(1 + pk) / 2);
                g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${active ? "#e67e22" : "#999"}" stroke-width="${w}"/>`;
                g += `<text x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 6}" font-size="11" text-anchor="middle" fill="#444">${pk}</text>`;
            }
            for (const [n, p] of Object.entries(pos)) {
                if (p.sw) {
                    g += `<rect x="${p.x - 35}" y="${p.y - 20}" width="70" height="40" rx="6" fill="#2c6fbb"/>`;
                    g += `<text x="${p.x}" y="${p.y + 5}" font-size="14" text-anchor="middle" fill="#fff">${esc(n)}</text>`;
                } else {
                    g += `<rect x="${p.x - 40}" y="${p.y - 22}" width="80" height="44" rx="6" fill="#eef3fb" stroke="#2c6fbb"/>`;
                    g += `<text x="${p.x}" y="${p.y - 3}" font-size="13" text-anchor="middle">${esc(n)}</text>`;
                    g += `<text x="${p.x}" y="${p.y + 13}" font-size="10" text-anchor="middle" fill="#555">${esc(s.hosts[n].ip)}</text>`;
                }
            }
            $("topo").innerHTML = g + "</svg>";
        }
        function render(s) {
            drawTopo(s);
            $("time").textContent = s.time.toFixed(2) + " s";
            $("pin").textContent = s.packet_in_total;
            fillSelects(s.hosts);

            let h = "<h3>Host</h3><table>" + head(["Tên", "IP", "Số ping", "RTT gần nhất (ms)"]);
            for (const [name, x] of Object.entries(s.hosts)) {
                const last = x.rtts.length ? (x.rtts[x.rtts.length - 1] * 1000).toFixed(2) : "-";
                h += row([name, x.ip, x.rtts.length, last]);
            }
            $("hosts").innerHTML = h + "</table>";

            let sw = "";
            for (const [name, x] of Object.entries(s.switches)) {
                sw += `<h3>Switch ${esc(name)} (table-miss: ${x.table_misses})</h3>`;
                sw += "<table>" + head(["Cổng", "rx gói", "rx byte", "tx gói", "tx byte"]);
                for (const [p, c] of Object.entries(x.ports))
                    sw += row([p, c.rx_packets, c.rx_bytes, c.tx_packets, c.tx_bytes]);
                sw += "</table><table>" + head(["eth_dst", "cổng ra", "ưu tiên", "gói", "byte", "idle_timeout"]);
                for (const f of x.flows)
                    sw += row([f.match.eth_dst, f.out_port, f.priority, f.packets, f.bytes, f.idle_timeout ?? "-"]);
                sw += "</table>";
            }
            $("switches").innerHTML = sw;
        }

        const ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onopen = () => $("status").textContent = "đã kết nối";
        ws.onclose = () => $("status").textContent = "mất kết nối";
        ws.onmessage = e => render(JSON.parse(e.data));

        $("go").onclick = () => fetch("/ping", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ src: $("src").value, dst: $("dst").value }),
        });
    </script>
</body>

</html>
