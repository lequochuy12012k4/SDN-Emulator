<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>SDN Emulator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 16px;
        }

        table {
            border-collapse: collapse;
            margin: 6px 0 14px;
        }

        th,
        td {
            border: 1px solid #bbb;
            padding: 3px 10px;
            text-align: right;
        }

        th {
            background: #eee;
        }

        .bar span {
            margin-right: 20px;
        }

        h3 {
            margin: 14px 0 2px;
        }

        #topo svg {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <h2>SDN Emulator</h2>
    <div class="bar">
        <span>Kết nối: <b id="status">...</b></span>
        <span>Controller: <b id="ctl">-</b></span>
        <span>Giờ ảo: <b id="time">-</b></span>
        <span>PACKET_IN: <b id="pin">-</b></span>
    </div>
    <p>
        Ping từ <select id="src"></select> tới <select id="dst"></select>
        <button id="go">Ping</button>
    </p>
    <div id="topo"></div>
    <div id="links"></div>
    <div id="hosts"></div>
    <div id="switches"></div>

    <script>
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const row = cells => "<tr>" + cells.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>";
        const head = cols => "<tr>" + cols.map(c => `<th>${esc(c)}</th>`).join("") + "</tr>";

        let hostOptionsKey = null;
        function fillSelects(hosts) {
            const names = Object.keys(hosts);
            const key = JSON.stringify(names);
            if (key === hostOptionsKey) return;
            const src = $("src"), dst = $("dst");
            const srcValue = src.value, dstValue = dst.value;
            for (const select of [src, dst]) {
                select.options.length = 0;
                for (const name of names) select.add(new Option(name, name));
            }
            if (names.includes(srcValue)) src.value = srcValue;
            if (names.includes(dstValue)) dst.value = dstValue;
            else if (names.length > 1) dst.selectedIndex = 1;
            hostOptionsKey = key;
        }
        let prev = {};

        function layout(s) {
            const pos = {};
            const switches = Object.keys(s.switches).sort();
            const hosts = Object.keys(s.hosts).sort();
            const adjacent = new Map(switches.map(n => [n, new Set()]));
            for (const l of s.links) {
                if (adjacent.has(l.a) && adjacent.has(l.b)) {
                    adjacent.get(l.a).add(l.b);
                    adjacent.get(l.b).add(l.a);
                }
            }
            const maxDegree = Math.max(0, ...switches.map(n => adjacent.get(n).size));
            const spines = switches.filter(n => adjacent.get(n).size === maxDegree);
            const leaves = switches.filter(n => !spines.includes(n));
            const spineLeaf = spines.length >= 2 && leaves.length >= 2 &&
                spines.every(sp => adjacent.get(sp).size === leaves.length &&
                    leaves.every(leaf => adjacent.get(sp).has(leaf))) &&
                leaves.every(leaf => adjacent.get(leaf).size === spines.length &&
                    spines.every(sp => adjacent.get(leaf).has(sp)));
            if (spineLeaf) {
                const width = Math.max(
                    480,
                    160 + (leaves.length - 1) * 150,
                    hosts.length ? 160 + (hosts.length - 1) * 125 : 0
                );
                const leafStartX = (width - (leaves.length - 1) * 150) / 2;
                leaves.forEach((n, i) => pos[n] = { x: leafStartX + i * 150, y: 190, sw: true });
                spines.forEach((n, i) => pos[n] = {
                    x: width * (i + 1) / (spines.length + 1),
                    y: 80,
                    sw: true
                });
                const hostStartX = (width - (hosts.length - 1) * 125) / 2;
                hosts.forEach((n, i) => pos[n] = {
                    x: hostStartX + i * 125,
                    y: 320,
                    sw: false
                });
                return { pos, width, height: hosts.length ? 372 : 260 };
            }
            const levels = new Map(), visited = new Set();
            for (const start of switches) {
                if (visited.has(start)) continue;
                const component = [], pending = [start];
                visited.add(start);
                while (pending.length) {
                    const n = pending.pop();
                    component.push(n);
                    for (const next of adjacent.get(n)) {
                        if (!visited.has(next)) {
                            visited.add(next);
                            pending.push(next);
                        }
                    }
                }
                const root = component.reduce((best, n) =>
                    adjacent.get(n).size > adjacent.get(best).size ? n : best);
                const distance = new Map([[root, 0]]), queue = [root];
                for (let i = 0; i < queue.length; i++) {
                    const n = queue[i], depth = distance.get(n);
                    if (!levels.has(depth)) levels.set(depth, []);
                    levels.get(depth).push(n);
                    for (const next of adjacent.get(n)) {
                        if (!distance.has(next)) {
                            distance.set(next, depth + 1);
                            queue.push(next);
                        }
                    }
                }
            }
            for (const nodes of levels.values()) nodes.sort();

            const maxDepth = Math.max(0, ...levels.keys());
            const maxLevelSize = Math.max(1, ...[...levels.values()].map(nodes => nodes.length));
            const horizontal = maxDepth >= maxLevelSize - 1;
            const width = Math.max(
                480,
                horizontal ? 230 + maxDepth * 180 : 160 + (maxLevelSize - 1) * 150,
                hosts.length ? 160 + (hosts.length - 1) * 125 : 0
            );
            for (const [depth, nodes] of levels) {
                nodes.forEach((n, i) => {
                    if (horizontal) {
                        pos[n] = {
                            x: 115 + depth * 180,
                            y: 80 + ((maxLevelSize - nodes.length) / 2 + i) * 110,
                            sw: true
                        };
                    } else {
                        pos[n] = {
                            x: (width - (nodes.length - 1) * 150) / 2 + i * 150,
                            y: 80 + depth * 140,
                            sw: true
                        };
                    }
                });
            }
            const maxSwitchY = Math.max(80, ...switches.map(n => pos[n].y));
            const hostY = switches.length ? maxSwitchY + 130 : 110;
            const hostStartX = (width - (hosts.length - 1) * 125) / 2;
            hosts.forEach((n, i) => pos[n] = {
                x: hostStartX + i * 125,
                y: hostY,
                sw: false
            });
            const height = Math.max(260, hostY + (hosts.length ? 52 : 60));
            return { pos, width, height };
        }

        function linkPackets(s, l) {
            for (const [n, p] of [[l.a, l.a_port], [l.b, l.b_port]]) {
                const c = s.switches[n] && s.switches[n].ports[p];
                if (c) return c.rx_packets + c.tx_packets;
            }
            return 0;
        }

        function portLabel(pos, name, peer, port) {
            const from = pos[name], to = pos[peer];
            const dx = to.x - from.x, dy = to.y - from.y;
            const halfWidth = from.sw ? 35 : 40, halfHeight = from.sw ? 20 : 22;
            const scaleX = dx === 0 ? Infinity : (halfWidth + 7) / Math.abs(dx);
            const scaleY = dy === 0 ? Infinity : (halfHeight + 7) / Math.abs(dy);
            const scale = Math.min(scaleX, scaleY);
            const x = from.x + dx * scale, y = from.y + dy * scale;
            const anchor = dx > 0 ? "start" : dx < 0 ? "end" : "middle";
            return `<text x="${x}" y="${y}" font-size="10" text-anchor="${anchor}" dominant-baseline="middle" fill="#222" stroke="#fff" stroke-width="4" paint-order="stroke"><title>${esc(`${name} cổng ${port}`)}</title>cổng ${esc(port)}</text>`;
        }

        function drawTopo(s) {
            const { pos, width: W, height: H } = layout(s);
            let g = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
            const labels = [];
            for (const l of s.links) {
                const a = pos[l.a], b = pos[l.b];
                if (!a || !b) continue;
                const key = `${l.a}:${l.a_port}-${l.b}:${l.b_port}`;
                const pk = linkPackets(s, l);
                const active = pk > (prev[key] ?? pk);     // có gói mới kể từ lần đẩy trước
                prev[key] = pk;
                const w = 2 + Math.min(6, Math.log2(1 + pk) / 2);
                g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${active ? "#e67e22" : "#999"}" stroke-width="${w}"/>`;
                g += `<text x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 6}" font-size="11" text-anchor="middle" fill="#444">${pk}</text>`;
                labels.push(portLabel(pos, l.a, l.b, l.a_port));
                labels.push(portLabel(pos, l.b, l.a, l.b_port));
            }
            for (const [n, p] of Object.entries(pos)) {
                if (p.sw) {
                    g += `<rect x="${p.x - 35}" y="${p.y - 20}" width="70" height="40" rx="6" fill="#2c6fbb"/>`;
                    g += `<text x="${p.x}" y="${p.y + 5}" font-size="14" text-anchor="middle" fill="#fff">${esc(n)}</text>`;
                } else {
                    g += `<rect x="${p.x - 40}" y="${p.y - 22}" width="80" height="44" rx="6" fill="#eef3fb" stroke="#2c6fbb"/>`;
                    g += `<text x="${p.x}" y="${p.y - 3}" font-size="13" text-anchor="middle">${esc(n)}</text>`;
                    g += `<text x="${p.x}" y="${p.y + 13}" font-size="10" text-anchor="middle" fill="#555">${esc(s.hosts[n].ip)}</text>`;
                }
            }
            g += labels.join("");
            $("topo").innerHTML = g + "</svg>";
        }
        function idleText(f, now) {
            if (f.idle_timeout == null) return "không hết hạn";
            const left = Math.max(0, f.idle_timeout - (now - f.last_hit));
            return `${f.idle_timeout}s (còn ${left.toFixed(1)}s)`;
        }

        function fmtBw(b) {
            if (b == null) return "không giới hạn";
            if (b >= 1e9) return `${+(b / 1e9).toFixed(3)} Gb/s`;
            if (b >= 1e6) return `${+(b / 1e6).toFixed(3)} Mb/s`;
            if (b >= 1e3) return `${+(b / 1e3).toFixed(3)} kb/s`;
            return `${b} b/s`;
        }

        function dirText(d) {
            let t = `${d.sent_packets} gói, mất ${d.dropped_loss}, tràn hàng đợi ${d.dropped_queue}`;
            if (d.queued) t += `, đang đợi ${d.queued}`;
            return t;
        }
        function linksHtml(links) {
            let h = "<h3>Liên kết</h3><table>" +
                head(["Liên kết", "độ trễ", "băng thông", "mất gói", "hàng đợi tối đa", "chiều a → b", "chiều b → a"]);
            for (const l of links)
                h += row([`${l.a}:${l.a_port} — ${l.b}:${l.b_port}`, `${+(l.delay * 1000).toFixed(3)} ms`,
                fmtBw(l.bandwidth), `${+(l.loss * 100).toFixed(2)}%`, l.queue_limit ?? "-",
                dirText(l.a_to_b), dirText(l.b_to_a)]);
            return h + "</table>";
        }
        function render(s) {
            $("links").innerHTML = linksHtml(s.links);
            $("ctl").textContent = s.controller.mode === "openflow"
                ? "OpenFlow " + Object.entries(s.controller.switches)
                    .map(([n, ok]) => n + (ok ? " ✔" : " ✘")).join(" ")
                : "nội bộ";
            drawTopo(s);
            $("time").textContent = s.time.toFixed(2) + " s";
            $("pin").textContent = s.packet_in_total;
            fillSelects(s.hosts);

            let h = "<h3>Host</h3><table>" + head(["Tên", "IP", "Số ping", "RTT gần nhất (ms)"]);
            for (const [name, x] of Object.entries(s.hosts)) {
                const last = x.rtts.length ? (x.rtts[x.rtts.length - 1] * 1000).toFixed(2) : "-";
                h += row([name, x.ip, x.rtts.length, last]);
            }
            $("hosts").innerHTML = h + "</table>";

            let sw = "";
            for (const [name, x] of Object.entries(s.switches)) {
                sw += `<h3>Switch ${esc(name)} (table-miss: ${x.table_misses})</h3>`;
                sw += "<table>" + head(["Cổng", "rx gói", "rx byte", "tx gói", "tx byte"]);
                for (const [p, c] of Object.entries(x.ports))
                    sw += row([p, c.rx_packets, c.rx_bytes, c.tx_packets, c.tx_bytes]);
                sw += "</table><table>" + head(["match", "cổng ra", "ưu tiên", "gói", "byte", "idle_timeout còn lại"]);
                for (const f of x.flows)
                    sw += row([
                        Object.entries(f.match).map(([k, v]) => `${k}=${v}`).join(", ") || "(mọi gói)",
                        f.out_port, f.priority, f.packets, f.bytes,
                        f.idle_timeout == null
                            ? "-"
                            : `${Math.max(0, f.idle_timeout - (s.time - f.last_hit)).toFixed(1)} s`
                    ])
                sw += "</table>";
            }
            $("switches").innerHTML = sw;
        }

        const ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onopen = () => $("status").textContent = "đã kết nối";
        ws.onclose = () => $("status").textContent = "mất kết nối";
        ws.onmessage = e => render(JSON.parse(e.data));

        $("go").onclick = () => fetch("/ping", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ src: $("src").value, dst: $("dst").value }),
        });
    </script>
</body>

</html>
