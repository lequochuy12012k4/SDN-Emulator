<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>SDN Emulator — Web Dashboard</title>
  <link rel="stylesheet" href="/styles/desktop.css">
  <style>
    /* Bổ sung các định dạng riêng cho Web Dashboard */
    body { padding: 18px 22px; height: auto; overflow: auto; user-select: auto; }
    .topbar {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .title {
      font-size: 17px; font-weight: 800; margin-right: 8px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .pill {
      font-size: 12.5px; background: var(--bg-elevated); border: 1px solid var(--border-strong);
      padding: 5px 12px; border-radius: 999px; color: var(--text-muted); font-variant-numeric: tabular-nums;
    }
    .pill b { color: var(--text); }
    .card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .card-title { font-size: 14.5px; font-weight: 700; margin: 0; color: var(--text); }
    .ping-bar { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; }
    .ping-bar select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-elevated); color: var(--text); }
    #topo {
      border-radius: 10px; border: 1px solid var(--border); overflow-x: auto;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(var(--grid-dot) 1.1px, transparent 1.1px);
      background-size: 22px 22px;
    }
    .empty-msg { padding: 48px 20px; text-align: center; color: var(--text-muted); font-size: 13.5px; }
    .grid-2 { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(540px, 1.5fr); gap: 14px; }
    @media (max-width: 1050px) { .grid-2 { grid-template-columns: 1fr; } }
    .sw-grid { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(460px, 1.55fr); gap: 16px; align-items: start; }
    @media (max-width: 980px) { .sw-grid { grid-template-columns: 1fr; } }
    .sw-pane { min-width: 0; }
    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-strong); margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.6px; }
    th, td { border: 1px solid var(--border-strong); padding: 7px 10px; text-align: right; font-variant-numeric: tabular-nums; }
    th { background: var(--bg-elevated); color: var(--text-muted); font-weight: 700; text-align: center; font-size: 11.5px; text-transform: uppercase; border-top: none; }
    th:first-child, td:first-child { border-left: none; }
    th:last-child, td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }
    table.td-left td:first-child { text-align: left; }
    table.td-center td:first-child { text-align: center; font-weight: 600; }
    h4 { margin: 4px 0 4px; font-size: 13px; color: var(--text-muted); }
    .badge-sw { display: inline-block; padding: 3px 9px; border-radius: 6px; background: rgba(37,99,235,0.14); color: #3b82f6; font-weight: 700; font-size: 12.5px; }
    .pkt-dot { pointer-events: none; filter: drop-shadow(0 0 6px currentColor); }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="title">SDN Emulator — Web Dashboard</span>
    <span class="pill">Kết nối: <b id="status">...</b></span>
    <span class="pill">Controller: <b id="ctl">-</b></span>
    <span class="pill">Giờ ảo: <b id="time">0.00 s</b></span>
    <span class="pill">PACKET_IN: <b id="pin">0</b></span>
    <div class="spacer"></div>
    <div class="theme-switch" title="Chế độ hiển thị">
      <span class="theme-lbl">Giao diện</span>
      <button type="button" class="theme-btn" data-mode="light" title="Giao diện sáng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
      <button type="button" class="theme-btn" data-mode="dark" title="Giao diện tối">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
      <button type="button" class="theme-btn" data-mode="system" title="Theo thiết bị">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3 class="card-title">Topology đồng bộ trực tiếp</h3>
      <div class="ping-bar">
        <span>Ping từ</span>
        <select id="src"></select>
        <span>tới</span>
        <select id="dst"></select>
        <button class="btn btn-primary" id="go">Gửi Ping</button>
      </div>
    </div>
    <div id="topo"></div>
  </div>

  <div class="grid-2">
    <div class="card" id="hostsCard"></div>
    <div class="card" id="linksCard"></div>
  </div>
  <div id="switches"></div>

  <!-- DÙNG ĐƯỜNG DẪN CHUẨN /scripts/index.js -->
  <script src="/scripts/index.js"></script>
</body>
</html>
