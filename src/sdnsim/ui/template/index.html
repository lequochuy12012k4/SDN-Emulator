<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>SDN Emulator — Web Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/style/index.css">
  <link rel="icon" type="image/png" href="/assets/template/icon.png">
</head>
<body>
  <div class="topbar">
    <span class="title">SDN Emulator — Web Dashboard</span>
    <span class="pill">Kết nối: <b id="status">...</b></span>
    <span class="pill">Controller: <b id="ctl">-</b></span>
    <span class="pill">Giờ ảo: <b id="time">0.00 s</b></span>
    <span class="pill">PACKET_IN: <b id="pin">0</b></span>
    <div class="spacer"></div>
    <div class="theme-switch" title="Chế độ hiển thị">
      <span class="theme-lbl">Giao diện</span>
      <button type="button" class="theme-btn" data-mode="light" title="Giao diện sáng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
      <button type="button" class="theme-btn" data-mode="dark" title="Giao diện tối">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
      <button type="button" class="theme-btn" data-mode="system" title="Theo thiết bị">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3 class="card-title">Topology đồng bộ trực tiếp</h3>
      <div class="ping-bar">
        <span>Ping từ</span>
        <select id="src"></select>
        <span>tới</span>
        <select id="dst"></select>
        <button class="primary" id="go">Gửi Ping</button>
      </div>
    </div>
    <div id="topo"></div>
  </div>

  <div class="grid-2">
    <div class="card" id="hostsCard"></div>
    <div class="card" id="linksCard"></div>
  </div>
  <div id="switches"></div>
  <script src="/assets/script/index.js"></script>
</body>
</html>
